name: Build SPTC SupportDrawings DLL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify production commands and backup-safe generator
        shell: pwsh
        run: |
          $root='src/SPTC.SupportDrawings'
          $gen=Get-Content "$root/SupportOrthoTenViewGenerator.cs" -Raw
          $commands=Get-Content "$root/SupportDrawingCommands.cs" -Raw
          if($commands.Contains('SPTC_ORTHO19_TOP_ONECMD_TEST') -or
             $commands.Contains('SPTC REV19:')) {
            throw 'Obsolete REV19 NETLOAD banner has returned'
          }
          if(-not $commands.Contains('public void Initialize() { }')) {
            throw 'Expected silent Initialize() for the cleaned production DLL'
          }
          $labels=Get-Content "$root/SupportOrthoPipeCallout29.cs" -Raw
          if(-not $gen.Contains('SPTC_SUPPORTORTHO10')) {throw 'Production 10-view command missing'}
          # No extra modal/typed revision confirmation after the user starts
          # SPTC_SUPPORTORTHO10; retain the independent input and write guards.
          foreach($obsolete in @('REV22.29 TEST', 'PromptStringOptions(',
              'MessageBox.Show(')) {
            if($gen.Contains($obsolete)) {
              throw "REV22.35 obsolete Ortho confirmation still found: $obsolete"
            }
          }
          # Logo is included in the assembly, never loaded from an external path.
          $brand=Get-Content "$root/SupportBranding36.cs" -Raw
          $logoDefs=[regex]::Matches($brand,
              'private const string (LogoPng|MarkPng) = "([A-Za-z0-9+/=]+)";')
          if($logoDefs.Count -ne 2) {
            throw 'SPTC embedded wordmark/window-mark assets missing'
          }
          foreach($definition in $logoDefs) {
            $bytes=[Convert]::FromBase64String(
                $definition.Groups[2].Value)
            if($bytes.Length -lt 500 -or
               [Convert]::ToHexString($bytes,0,8) -ne '89504E470D0A1A0A') {
              throw "SPTC branding PNG is corrupt: $($definition.Groups[1].Value)"
            }
            Write-Host "$($definition.Groups[1].Value) embedded PNG bytes: $($bytes.Length)"
          }
          $manager=Get-Content "$root/SupportDrawingManagerForm35.cs" -Raw
          $batchUi=Get-Content "$root/SupportBatchDialog.cs" -Raw
          foreach($token in @('SupportBranding36.MakeLogo',
              'SupportBranding36.CreateIcon')) {
            if(-not $manager.Contains($token) -or
               -not $batchUi.Contains($token)) {
              throw "SPTC branding absent from UI: $token"
            }
          }
          $ui=Get-Content "$root/SupportDrawingManagerForm35.cs" -Raw
          foreach($option in @('SupportFocus','AutoSeed','DrawingPrefix',
              'ScaleDenominator','Views','LineNumber','Bop','Tos',
              'Description','BatchOrtho','SupportDrawingProgressForm35')) {
            if(-not $ui.Contains($option)) {
              throw "REV22.35 UI option missing: $option"
            }
          }
          # REV22.39: custom 1:N must feed the same guarded paper-scale
          # denominator as the original Automatic/preset selections.
          $scaleHelper=Get-Content "$root/SupportDrawingPaperScale39.cs" -Raw
          foreach($token in @('Custom 1:N...','return Valid(customDenominator)',
              'return 0;','Max=1000000','Min=1')) {
            if(-not $scaleHelper.Contains($token)) {
              throw "REV22.39 custom paper scale parser missing: $token"
            }
          }
          foreach($token in @('NumericUpDown customScale',
              'SupportDrawingPaperScale39.Custom',
              'SupportDrawingPaperScale39.Resolve(',
              'customScale.Value','customScale.Minimum',
              'customScale.Maximum','customScale.Visible')) {
            if(-not $ui.Contains($token)) {
              throw "REV22.39 custom scale form binding missing: $token"
            }
          }
          foreach($token in @('options.ScaleDenominator<fit.Denominator',
              'NativeOrthoTenViewAutoPlacement26.Build(fit,w,h)',
              'Denominator=options.ScaleDenominator',
              'Scale=1.0/options.ScaleDenominator')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.39 scale fit/placement protection missing: $token"
            }
          }
          foreach($token in @('GenerateOne','SupportDrawingUiOptions',
              'SupportDrawingPalette40.ShowOrFocus','selectedOverride',
              'options.AutoSeed','options.Views.Count',
              'options.ScaleDenominator','options.LineNumber',
              'options.Bop','options.Tos','options.Description',
              'SPTC_REV22_35_BATCH_REPORT','File.AppendAllText(')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.35 native integration missing: $token"
            }
          }
          foreach($token in @('SourceRegistrationVerified',
              'IsNativeOrthoValid(part.OrthoPart, seed)',
              'EMPTY_REGISTERED_ORTHO','if (File.Exists(dest))')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.35 project preflight missing: $token"
            }
          }
          foreach($requiredCheck in @('SourceRegistrationVerified',
              'IsNativeOrthoValid(part.OrthoPart, seed)',
              'EMPTY_REGISTERED_ORTHO',
              'if (File.Exists(dest))',
              'if (!Guid.TryParse(')) {
            if(-not $gen.Contains($requiredCheck)) {
              throw "REV22.35 registration safeguard missing: $requiredCheck"
            }
          }
          # REV22.37: the XREF source DWG must come from its real
          # loaded Database.Filename, never a guessed block reference name.
          $xref=Get-Content "$root/SupportOrthoXrefMemberDiscovery37.cs" -Raw
          $plan=Get-Content "$root/SupportOrthoMemberCalloutPlan27.cs" -Raw
          foreach($part in @('GetXrefDatabase(false)','xdb.Filename',
              'Path.GetFileName(sourceFile)','StructureMember',
              'SupportOrthoSupportLabel24.IsSupportClass',
              'ext.TransformBy(toHost)','Inside(','ClippedCenter(')) {
            if(-not $xref.Contains($part)) {
              throw "REV22.37 XREF scan invariant missing: $part"
            }
          }
          foreach($part in @('options.XrefMemberNames',
              'xrefMembers.Items','xrefNearCube',
              'XREF_SOURCE_DWG','REV22_37_XREF_SOURCE=',
              'xrefWritten','nativeWritten')) {
            if(-not $gen.Contains($part)) {
              throw "REV22.37 XREF integration missing: $part"
            }
          }
          foreach($part in @('XrefDrawingName','IsXrefMember',
              'XREF_FILENAME_NO_LABEL_SPACE')) {
            if(-not $plan.Contains($part)) {
              throw "REV22.37 annotation priority missing: $part"
            }
          }
          if(-not $ui.Contains('xrefNames.Checked = true') -or
             -not $ui.Contains('Nearby XREF members: label source DWG')) {
            throw 'REV22.37 XREF filename checkbox or default missing'
          }
          # REV22.40: exactly one persistent AutoCAD modeless PaletteSet.
          # Reuse the same four command registrations for button-queued
          # drawing creation; no direct native Editor calls from WinForms.
          $palette=Get-Content "$root/SupportDrawingPalette40.cs" -Raw
          foreach($token in @('new PaletteSet(', 'palette.Visible=true',
              'manager.RunRequested+=QueueFromPalette',
              'doc.SendStringToExecute(command+" "',
              'TryTakeQueuedOrtho', 'CommandEnded+=',
              'CommandCancelled+=','CommandFailed+=',
              'SetRunning(true)', 'SetRunning(false)',
              'DockEnabled=DockSides.Left')) {
            if(-not $palette.Contains($token)) {
              throw "REV22.40 persistent palette guard missing: $token"
            }
          }
          if(-not $ui.Contains('WinForms.UserControl') -or
             $ui.Contains('SupportDrawingManagerForm35 : WinForms.Form') -or
             $ui.Contains('DialogResult = DialogResult.OK;') -or
             $ui.Contains('Close();')) {
            throw 'REV22.40 manager must be a persistent UserControl'
          }
          foreach($token in @('RunRequested?.Invoke(Settings)',
              'if(IsRunning)return;', 'internal void SetRunning(',
              'internal void UpdateProjectContext(', 'MinimumSize = new Size(780, 740)')) {
            if(-not $ui.Contains($token)) {
              throw "REV22.40 settings/busy guard missing: $token"
            }
          }
          if($gen.Contains('ui.ShowDialog()') -or
             -not $gen.Contains('RunQueuedOrtho(') -or
             -not $gen.Contains('SupportDrawingPalette40.Finish(')) {
            throw 'REV22.40 must dispatch through modeless command context'
          }
          foreach($token in @('SupportOrthoPipeDiscovery28.ReadXrefs',
              'SupportOrthoMemberCalloutPlan27.Build',
              'CreateNativePaperMemberLeaders27',
              'STEP10_MEMBER_ANNOTATIONS_CHECK',
              'STEP5_PAPER_POINT_CLICKS_REQUIRED=0')) {
            if(-not $gen.Contains($token)) {throw "Critical generation invariant missing: $token"}
          }
          foreach($legacy in @('SupportOrthoUpdateAudit29.cs',
              'SupportOrthoXrefUpdateAudit30.cs',
              'SupportOrthoXrefAuditManifest30.cs')) {
            if(Test-Path "$root/$legacy") {throw "Completed audit still ships: $legacy"}
          }
          $sourceText=(Get-ChildItem $root -Filter '*.cs' |
            ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          foreach($cmd in @('SPTC_ORTHO22_29_AUDIT_UPDATE',
              'SPTC_ORTHO22_30_VALIDATE_XREF_UPDATE')) {
            if($sourceText.Contains($cmd)) {
              throw "Obsolete audit command still registered: $cmd"
            }
          }
          # All command registrations in the shipped source must equal exactly these four.
          $required=@('SPTC_SUPPORTORTHO10','SPTC_SUPPORTEXPORT',
              'SPTC_SUPPORTBATCH','SPTC_SUPPORT2DBATCH') | Sort-Object
          $actual=@()
          foreach($hit in [regex]::Matches($sourceText,
              '\[\s*CommandMethod\s*\(\s*"([^"]+)"')) {
            $actual+= $hit.Groups[1].Value
          }
          $actual=@($actual | Sort-Object)
          if($actual.Count -ne 4 -or
             @(Compare-Object -ReferenceObject $required -DifferenceObject $actual).Count -gt 0) {
            throw "REV22.33 requires exactly four commands. Found: $($actual -join ', ')"
          }
          foreach($diagnostic in @('NativeOrthoTopPreflight.cs',
              'NativeOrthoIsoReferenceComparison.cs')) {
            if(Test-Path "$root/$diagnostic") {throw "Legacy command file still shipped: $diagnostic"}
          }
          # REV22.38 visible annotation: no LINE NO/XREF STRUCTURE/SUPPORT
          # prefixes, no .dwg suffix; preserve BOP and source provenance.
          if(-not $labels.Contains('return tag+"\n"+bop;') -or
             $labels.Contains('return "LINE NO: "+tag')) {
            throw 'REV22.38 bare pipe tag and unchanged BOP formatting missing'
          }
          $members=Get-Content "$root/SupportOrthoMemberCalloutPlan27.cs" -Raw
          if(-not $members.Contains('Path.GetFileNameWithoutExtension(member.XrefDrawingName!)') -or
             $members.Contains('"XREF "+(member.XrefKind')) {
            throw 'REV22.38 XREF source basename label missing'
          }
          if(-not $gen.Contains('REV22_38_PIPE_LABEL_FORMAT=BARE_LINE_TAG_AND_BOP')) {
            throw 'REV22.38 pipe label log marker missing'
          }
          if(Get-ChildItem $root -Filter '*Test.cs') {
            throw 'Historical development command clones must not ship in the active source tree'
          }
          if(Select-String -Path "$root/*.cs" -Pattern '\[CommandMethod\(".*_TEST"') {
            throw 'Experimental test commands must not be in the production assembly'
          }
      - name: Test support geometry and native-viewport projection helpers
        run: dotnet run --project tests/SupportSheetSmokeTests/SupportSheetSmokeTests.csproj -c Release
      - name: Test compact XREF pipe labels
        run: dotnet run --project tests/Rev229LabelSmokeTests/Rev229LabelSmokeTests.csproj -c Release
      - name: Test REV22.35 native view subset and title-callout guards
        run: dotnet run --project tests/Rev235UiSmokeTests/Rev235UiSmokeTests.csproj -c Release
      - name: Test embedded logo and Windows Forms icon
        run: dotnet run --project tests/Rev236BrandingSmokeTests/Rev236BrandingSmokeTests.csproj -c Release
      - name: Test REV22.39 automatic, preset and custom 1:N scales
        run: dotnet run --project tests/Rev239ScaleSmokeTests/Rev239ScaleSmokeTests.csproj -c Release
      - name: Test REV22.40 persistent WinForms UI and queued-run busy control
        run: dotnet run --project tests/Rev240PaletteSmokeTests/Rev240PaletteSmokeTests.csproj -c Release
      - name: Compile production DLL
        run: dotnet build src/SPTC.SupportDrawings/SPTC.SupportDrawings.csproj -c Release
      - name: Verify compiled DLL
        shell: pwsh
        run: |
          $dll='src/SPTC.SupportDrawings/bin/Release/net8.0-windows/SPTC.SupportDrawings.dll'
          if(-not (Test-Path $dll)) {throw 'DLL not generated'}
          $size=(Get-Item $dll).Length
          if($size -lt 100000) {throw "DLL unexpectedly small: $size"}
          Write-Host "REV22.40 dockable persistent palette DLL bytes: $size"
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SPTC-SupportDrawings-Plant3D2025-REV22_40-PERSISTENT-PALETTE
          path: src/SPTC.SupportDrawings/bin/Release/net8.0-windows/SPTC.SupportDrawings.dll
          retention-days: 30
          if-no-files-found: error
