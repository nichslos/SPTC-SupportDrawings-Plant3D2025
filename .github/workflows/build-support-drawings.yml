          if(-not $planner.Contains('SUPPORT_GEOMETRIC_TOP_APPROX')) { throw 'Support geometric elevation must display as TOS ~, never exact' }
          if(-not $planner.Contains('"TOS ~ ":"TOS EL. "')) { throw 'Maintain correct per-line TOS formatting' }
          if(-not $new.Contains('new DBText') -or -not $new.Contains('GeometricExtents')) { throw 'Preserve no-wrap member and Support labels' }
      - name: Verify REV22.26 ten native Ortho views auto-placed with zero mouse clicks
        shell: pwsh
        run: |
          $new = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewAutoPlacementTest.cs' -Raw
          $prior = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewPlantSupportTosTest.cs' -Raw
          $planner = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewAutoPlacement26.cs' -Raw
          if($new -notmatch 'CommandMethod\("SPTC_ORTHO22_26_AUTO_PLACE_TEN_TEST"') { throw 'REV22.26 isolated command missing' }
          if($prior -notmatch 'CommandMethod\("SPTC_ORTHO22_25_SUPPORT_TOS_TEST"') { throw 'REV22.25 working baseline missing' }
          if($new -notmatch 'REV22.26 TEST') { throw 'Copied-project authorization missing' }
          if($new.Contains('.GetPoint(') -or $new.Contains('PromptPointOptions(')) { throw 'REV22.26 must never ask for a paper-space placement click' }
          foreach($key in @('NativeOrthoTenViewAutoPlacement26.Build(','STEP5_AUTO_PLACEMENT_ENABLED=True','STEP5_PAPER_POINT_CLICKS_REQUIRED=0','STEP10_REV22_TEN_GROUP_PLACED_AUTOMATICALLY=True','STEP10_ALL_TEN_NATIVE_VIEWS_REGISTERED=True','STEP10_VIEW_TITLE_COUNT','STEP10_SUPPORT_TOS_LABEL_COUNT','SupportOrthoPlantSupport25.Read','SupportOrthoMemberCalloutPlan25.Build','CreateNativePaperMemberLeaders25','NativeOrthoViewTitlePlan.BuildTitles','SupportFocusedCubePlanner.BuildAutomatic')) {
            if(-not $new.Contains($key)) { throw "REV22.26 critical functionality missing: $key" }
          }
          foreach($key in @('NativeOrthoTenViewPlan.BuildAdjusted','NativeOrthoViewTitlePlan.ReserveBelow','candidate.Views[0].CenterX','candidate.Views[0].CenterY','adjusted.WasAdjusted','reserved.Titles.Count!=10')) {
            if(-not $planner.Contains($key)) { throw "REV22.26 automatic TOP anchor or native title guard missing: $key" }
          }
          if($planner.Contains('.GetPoint(') -or $planner.Contains('PromptPointOptions(')) { throw 'Automatic planner cannot request user input' }
      - name: Verify REV22.27 Pipe Line Number Tag and BOP elevation annotations
        shell: pwsh
        run: |
          $new = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewPipeAnnotationsTest.cs' -Raw
          $prior = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewAutoPlacementTest.cs' -Raw
          $pipe = Get-Content 'src/SPTC.SupportDrawings/SupportOrthoPlantPipe27.cs' -Raw
          $fields = Get-Content 'src/SPTC.SupportDrawings/SupportOrthoPipeLabel27.cs' -Raw
          $planner = Get-Content 'src/SPTC.SupportDrawings/SupportOrthoMemberCalloutPlan27.cs' -Raw
          if($new -notmatch 'CommandMethod\("SPTC_ORTHO22_27_PIPE_BOP_TEST"') { throw 'Isolated REV22.27 command missing' }
          if($prior -notmatch 'CommandMethod\("SPTC_ORTHO22_26_AUTO_PLACE_TEN_TEST"') { throw 'Working REV22.26 fallback missing' }
          if($new -notmatch 'REV22.27 TEST') { throw 'Copied-project confirmation missing' }
          foreach($key in @('SupportOrthoPlantPipe27.Read(','SupportOrthoPipeLabel27.IsNativePipeType','SupportOrthoMemberCalloutPlan27.Build','CreateNativePaperMemberLeaders27','STEP10_PIPE_ANNOTATION_SOURCE_COUNT','STEP10_PIPE_BOP_LABEL_COUNT','STEP10_PIPE_BOP_EXPECTED','STEP10_HORIZONTAL_TOS_LABEL_COUNT','STEP10_SUPPORT_TOS_LABEL_COUNT','STEP10_ALL_TEN_NATIVE_VIEWS_REGISTERED=True','STEP5_PAPER_POINT_CLICKS_REQUIRED=0')) {
            if(-not $new.Contains($key)) { throw "REV22.27 functionality missing: $key" }
          }
          if($new.Contains('.GetPoint(') -or $new.Contains('PromptPointOptions(')) { throw 'REV22.27 must preserve zero paper insertion clicks' }
          foreach($key in @('FindAcPpRowId','GetAllProperties','LineNumberTag','BottomOfPipe','TypeDescriptor','BOUNDS_CLIPPED_TO_NATIVE_ORTHOCUBE','cube.MinX','cube.MaxX')) {
            if(-not $pipe.Contains($key)) { throw "REV22.27 source Pipe metadata not checked: $key" }
          }
          foreach($key in @('EXPLICIT_BOTTOM_OF_PIPE','BOP_NOT_AVAILABLE','Line Number Tag','Bottom of Pipe','LineNumberTag','BOP EL. ')) {
            if(-not $fields.Contains($key)) { throw "REV22.27 pipe PnP field requirement missing: $key" }
          }
          if($fields.Contains('TopOfPipe') -and $fields.Contains('BOP EL. ' + 'TopOfPipe')) { throw 'Do not substitute TOP for BOP' }
          if(-not $planner.Contains('PipeBopSource') -or -not $planner.Contains('PipeBopText') -or -not $planner.Contains('BopLines')) { throw 'REV22.27 BOP must be distinct from existing TOS' }
          if(-not $planner.Contains('bool isPipe=member.PipeBopSource!=null;')) { throw 'Explicit pipe BOP eligibility missing' }
          if(-not $new.Contains('new DBText') -or -not $new.Contains('GeometricExtents')) { throw 'Native nonwrapping label rendering missing' }
      - name: Verify REV22.28 native and nested-XREF pipe discovery is isolated
        shell: pwsh
        run: |
          $old = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewPipeAnnotationsTest.cs' -Raw
          $new = Get-Content 'src/SPTC.SupportDrawings/NativeOrthoTenViewXrefPipeAnnotationsTest.cs' -Raw
          $reader = Get-Content 'src/SPTC.SupportDrawings/SupportOrthoPipeDiscovery28.cs' -Raw
          if ($old -notmatch 'SPTC_ORTHO22_27_PIPE_BOP_TEST') { throw 'REV22.27 fallback must remain' }
          if ($new -notmatch 'SPTC_ORTHO22_28_XREF_AUTO_TEST') { throw 'REV22.28 command missing' }
          if ($new -match 'Select native Pipe objects for Line Number Tag') { throw 'Manual pipe selection persists' }
          foreach ($token in @('SupportOrthoPipeDiscovery28.Scan','SupportOrthoPipeDiscovery28.ReadXrefs',
                'SupportOrthoPlantPipe27.Read','SupportFocusedCubePlanner.BuildAutomatic',
                'STEP10_ALL_TEN_NATIVE_VIEWS_REGISTERED=True',
                'STEP5_PAPER_POINT_CLICKS_REQUIRED=0')) {
            if (-not $new.Contains($token)) { throw "REV22.28 command regression: $token" }
          }
          foreach ($token in @('IsFromExternalReference','IsFromOverlayReference','GetXrefDatabase(false)',
                'BlockTransform','Extents3d','TransformBy(toHost)','FindAcPpRowId',
                'GetAllProperties','XREF_PIPE_METADATA_UNAVAILABLE',
                'XREF_BOP_TRANSFORM_UNSUPPORTED','Math.Abs(o.Z-x.Z)',
                'XREF_CYCLE_SKIPPED')) {
            if (-not $reader.Contains($token)) { throw "REV22.28 XREF guard missing: $token" }
          }
          if ($reader -match 'SetProperties|ExecuteNonQuery|AddPnPDrawingFile') {
            throw 'REV22.28 scanner must be read-only'
          }
