name: Build SPTC SupportDrawings DLL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify production commands and backup-safe generator
        shell: pwsh
        run: |
          $root='src/SPTC.SupportDrawings'
          $gen=Get-Content "$root/SupportOrthoTenViewGenerator.cs" -Raw
          $commands=Get-Content "$root/SupportDrawingCommands.cs" -Raw
          if($commands.Contains('SPTC_ORTHO19_TOP_ONECMD_TEST') -or
             $commands.Contains('SPTC REV19:')) {
            throw 'Obsolete REV19 NETLOAD banner has returned'
          }
          if(-not $commands.Contains('SupportOrthoDimensionRefresh49.Start();') -or
             -not $commands.Contains('SupportOrthoDimensionRefresh49.Stop();')) {
            throw 'REV22.49 silent event initialization and disposal required'
          }
          $labels=Get-Content "$root/SupportOrthoPipeCallout29.cs" -Raw
          if(-not $gen.Contains('SPTC_SUPPORTORTHO10')) {throw 'Production 10-view command missing'}
          # No extra modal/typed revision confirmation after the user starts
          # SPTC_SUPPORTORTHO10; retain the independent input and write guards.
          foreach($obsolete in @('REV22.29 TEST', 'PromptStringOptions(',
              'MessageBox.Show(')) {
            if($gen.Contains($obsolete)) {
              throw "REV22.35 obsolete Ortho confirmation still found: $obsolete"
            }
          }
          # Logo is included in the assembly, never loaded from an external path.
          $brand=Get-Content "$root/SupportBranding36.cs" -Raw
          $logoDefs=[regex]::Matches($brand,
              'private const string (LogoPng|MarkPng) = "([A-Za-z0-9+/=]+)";')
          if($logoDefs.Count -ne 2) {
            throw 'SPTC embedded wordmark/window-mark assets missing'
          }
          foreach($definition in $logoDefs) {
            $bytes=[Convert]::FromBase64String(
                $definition.Groups[2].Value)
            if($bytes.Length -lt 500 -or
               [Convert]::ToHexString($bytes,0,8) -ne '89504E470D0A1A0A') {
              throw "SPTC branding PNG is corrupt: $($definition.Groups[1].Value)"
            }
            Write-Host "$($definition.Groups[1].Value) embedded PNG bytes: $($bytes.Length)"
          }
          $manager=Get-Content "$root/SupportDrawingManagerForm35.cs" -Raw
          $batchUi=Get-Content "$root/SupportBatchDialog.cs" -Raw
          foreach($token in @('SupportBranding36.MakeLogo',
              'SupportBranding36.CreateIcon')) {
            if(-not $manager.Contains($token) -or
               -not $batchUi.Contains($token)) {
              throw "SPTC branding absent from UI: $token"
            }
          }
          $ui=Get-Content "$root/SupportDrawingManagerForm35.cs" -Raw
          foreach($option in @('SupportFocus','AutoSeed','DrawingPrefix',
              'ScaleDenominator','Views','LineNumber','Bop','Tos',
              'Description','BatchOrtho','SupportDrawingProgressForm35')) {
            if(-not $ui.Contains($option)) {
              throw "REV22.35 UI option missing: $option"
            }
          }
          # REV22.39: custom 1:N must feed the same guarded paper-scale
          # denominator as the original Automatic/preset selections.
          $scaleHelper=Get-Content "$root/SupportDrawingPaperScale39.cs" -Raw
          foreach($token in @('Custom 1:N...','return Valid(customDenominator)',
              'return 0;','Max=1000000','Min=1')) {
            if(-not $scaleHelper.Contains($token)) {
              throw "REV22.39 custom paper scale parser missing: $token"
            }
          }
          foreach($token in @('NumericUpDown customScale',
              'SupportDrawingPaperScale39.Custom',
              'SupportDrawingPaperScale39.Resolve(',
              'customScale.Value','customScale.Minimum',
              'customScale.Maximum','customScale.Visible')) {
            if(-not $ui.Contains($token)) {
              throw "REV22.39 custom scale form binding missing: $token"
            }
          }
          foreach($token in @('options.ScaleDenominator<fit.Denominator',
              'NativeOrthoTenViewAutoPlacement26.Build(fit,w,h)',
              'Denominator=options.ScaleDenominator',
              'Scale=1.0/options.ScaleDenominator')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.39 scale fit/placement protection missing: $token"
            }
          }
          foreach($token in @('GenerateOne','SupportDrawingUiOptions',
              'SupportDrawingPalette40.ShowOrFocus','selectedOverride',
              'options.AutoSeed','options.Views.Count',
              'options.ScaleDenominator','options.LineNumber',
              'options.Bop','options.Tos','options.Description',
              'SPTC_REV22_35_BATCH_REPORT','File.AppendAllText(')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.35 native integration missing: $token"
            }
          }
          foreach($token in @('SourceRegistrationVerified',
              'IsNativeOrthoValid(part.OrthoPart, seed)',
              'EMPTY_REGISTERED_ORTHO','if (File.Exists(dest))')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.35 project preflight missing: $token"
            }
          }
          foreach($requiredCheck in @('SourceRegistrationVerified',
              'IsNativeOrthoValid(part.OrthoPart, seed)',
              'EMPTY_REGISTERED_ORTHO',
              'if (File.Exists(dest))',
              'if (!Guid.TryParse(')) {
            if(-not $gen.Contains($requiredCheck)) {
              throw "REV22.35 registration safeguard missing: $requiredCheck"
            }
          }
          # REV22.37: the XREF source DWG must come from its real
          # loaded Database.Filename, never a guessed block reference name.
          $xref=Get-Content "$root/SupportOrthoXrefMemberDiscovery37.cs" -Raw
          $plan=Get-Content "$root/SupportOrthoMemberCalloutPlan27.cs" -Raw
          foreach($part in @('GetXrefDatabase(false)','xdb.Filename',
              'Path.GetFileName(sourceFile)','StructureMember',
              'SupportOrthoSupportLabel24.IsSupportClass',
              'ext.TransformBy(toHost)','Inside(','ClippedCenter(')) {
            if(-not $xref.Contains($part)) {
              throw "REV22.37 XREF scan invariant missing: $part"
            }
          }
          foreach($part in @('options.XrefMemberNames',
              'xrefMembers.Items','xrefNearCube',
              'XREF_SOURCE_DWG','REV22_37_XREF_SOURCE=',
              'xrefWritten','nativeWritten')) {
            if(-not $gen.Contains($part)) {
              throw "REV22.37 XREF integration missing: $part"
            }
          }
          foreach($part in @('XrefDrawingName','IsXrefMember',
              'XREF_FILENAME_NO_LABEL_SPACE')) {
            if(-not $plan.Contains($part)) {
              throw "REV22.37 annotation priority missing: $part"
            }
          }
          if(-not $ui.Contains('xrefNames.Checked = true') -or
             -not $ui.Contains('Nearby XREF members: label source DWG')) {
            throw 'REV22.37 XREF filename checkbox or default missing'
          }
          # REV22.40: exactly one persistent AutoCAD modeless PaletteSet.
          # Reuse the same four command registrations for button-queued
          # drawing creation; no direct native Editor calls from WinForms.
          $palette=Get-Content "$root/SupportDrawingPalette40.cs" -Raw
          foreach($token in @('new PaletteSet(', 'palette.Visible=true',
              'manager.RunRequested+=QueueFromPalette',
              'doc.SendStringToExecute(command+" "',
              'TryTakeQueuedOrtho', 'CommandEnded+=',
              'CommandCancelled+=','CommandFailed+=',
              'SetRunning(true)', 'SetRunning(false)',
              'DockEnabled=DockSides.Left')) {
            if(-not $palette.Contains($token)) {
              throw "REV22.40 persistent palette guard missing: $token"
            }
          }
          if(-not $ui.Contains('WinForms.UserControl') -or
             $ui.Contains('SupportDrawingManagerForm35 : WinForms.Form') -or
             $ui.Contains('DialogResult = DialogResult.OK;') -or
             $ui.Contains('Close();')) {
            throw 'REV22.40 manager must be a persistent UserControl'
          }
          foreach($token in @('RunRequested?.Invoke(Settings)',
              'if(IsRunning)return;', 'internal void SetRunning(',
              'internal void UpdateProjectContext(', 'MinimumSize = new Size(780, 740)')) {
            if(-not $ui.Contains($token)) {
              throw "REV22.40 settings/busy guard missing: $token"
            }
          }
          if($gen.Contains('ui.ShowDialog()') -or
             -not $gen.Contains('RunQueuedOrtho(') -or
             -not $gen.Contains('SupportDrawingPalette40.Finish(')) {
            throw 'REV22.40 must dispatch through modeless command context'
          }
          # REV22.41: full model lengths must only come from explicit
          # native support/structure source End/Start positions, never a
          # bounding box. DIMLINEAR must be created in target PAPER SPACE,
          # never the source or loaded XREF databases.
          $dimSource=Get-Content "$root/SupportOrthoDimensionSource41.cs" -Raw
          $dimPlan=Get-Content "$root/SupportOrthoDimLinearPlan41.cs" -Raw
          $dimWriter=Get-Content "$root/SupportOrthoDimLinearWriter41.cs" -Raw
          foreach($token in @('ExplicitPoint(', 'DIM_ENDPOINTS_NOT_DECLARED',
              'DIM_ENDPOINTS_OUTSIDE_NATIVE_EXTENTS','id.Database',
              'Matrix3d.Identity','StructureMember','SupportOrthoSupportLabel24')) {
            if(-not $dimSource.Contains($token)) {
              throw "REV22.41 verified dimension source missing: $token"
            }
          }
          foreach($token in @('FRONT','BACK','TOP','BOTTOM','LEFT','RIGHT',
              'FORESHORTENED_PROJECTION','NON_AXIAL_PAPER_DIRECTION',
              'NO_NONOVERLAPPING_DIMLINE','Math.Abs(wz)',
              'source.Millimeters.ToString(')) {
            if(-not $dimPlan.Contains($token)) {
              throw "REV22.41 DIMLINEAR planner guard missing: $token"
            }
          }
          foreach($token in @('new RotatedDimension(', 'db.Dimstyle',
              'layout.BlockTableRecordId','item.Measurement,db.Dimstyle',
              'SPTC_AUTO_DIMLINEAR')) {
            if(-not (($dimWriter+$dimPlan).Contains($token))) {
              throw "REV22.41 paper dimension writer missing: $token"
            }
          }
          # REV22.42: avoid the repeated 828.28 mm dimension on TOP,
          # BOTTOM, LEFT, RIGHT, FRONT and BACK of the user's Ortho PDF.
          # Only one representative of each verified length/category/HV
          # orientation is dimensioned across a whole generated sheet.
          foreach($token in @('usedSources', 'usedValues',
              'EQUAL_LENGTH_ALREADY_DIMENSIONED_BY_',
              'SOURCE_ALREADY_DIMENSIONED_IN_',
              'OrderBy(c=>ViewPriority(c.Name))',
              'ViewPriority(string name)')) {
            if(-not $dimPlan.Contains($token)) {
              throw "REV22.42 compact DIMLINEAR guard missing: $token"
            }
          }
          foreach($token in @('REV22_42_COMPACT_DIMENSION_MODE',
              'REV22_42_REPEAT_DIMENSIONS_SUPPRESSED',
              'REV22_42_PREFERRED_VIEWS')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.42 compact DIMLINEAR log missing: $token"
            }
          }
          # REV22.43: preserve explicit Start/End member lengths, but allow a
          # different H= annotated overall-Z envelope for real upright Plant
          # structure/support that exposes no usable endpoint properties.
          # Do not infer generic block/solid dimensions or mislabeled cuts.
          foreach($token in @('TryVerticalOverallHeight(',
              'GEOMETRIC_OVERALL_Z_HEIGHT',
              'SOURCE=ENTITY_WCS_EXTENTS_NOT_CUT_LENGTH',
              'SupportOrthoDimLinearPlan41.AcceptOverallZHeight(',
              'verifiedStructureHandles','verifiedSupportHandles',
              'DIM_OVERALL_HEIGHT_VERIFIED=')) {
            if(-not $dimSource.Contains($token)) {
              throw "REV22.43 upright source evidence missing: $token"
            }
          }
          foreach($token in @('AcceptOverallZHeight(',
              'source.Provenance=="GEOMETRIC_OVERALL_Z_HEIGHT"',
              'string measurement=(overall?"H=":"")',
              'source.Provenance))')) {
            if(-not $dimPlan.Contains($token)) {
              throw "REV22.43 height vs cut-length safeguards missing: $token"
            }
          }
          foreach($token in @('REV22_43_EXPLICIT_MEMBER_LENGTH_SOURCES',
              'REV22_43_OVERALL_VERTICAL_HEIGHT_SOURCES',
              'REV22_43_OVERALL_HEIGHT_DIMENSIONS_PLANNED',
              'horizontalSteel.Members.Select(x=>x.Handle)',
              'plantSupports.Members.Select(x=>x.Handle)')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.43 vertical height integration missing: $token"
            }
          }
          # REV22.49.1: narrow structural supports still require
          # a correctly sized native TOP/ISO paper caption. Reserve only
          # paper-space title width, not source OrthoCube geometry/scale.
          $titlePlan=Get-Content "$root/NativeOrthoViewTitlePlan.cs" -Raw
          $tenPlan=Get-Content "$root/NativeOrthoTenViewPlan.cs" -Raw
          foreach($token in @('MinimumFrameWidth(', 'CaptionFor(viewName)',
              'TextHeightMm*.68', 'REV22.13 viewport too narrow')) {
            if(-not $titlePlan.Contains($token)) {
              throw "REV22.49.1 caption width invariant missing: $token"
            }
          }
          if(($tenPlan.Split('NativeOrthoViewTitlePlan.MinimumFrameWidth(').Count-1) -lt 2) {
            throw 'REV22.49.1 title width must apply both during anchor fitting and final viewport output'
          }
          # REV22.59: the next geometry tier uses real, vetted
          # native straight edges when the Plant custom object exposes
          # them. Never substitute WCS bounding-box corners for a
          # native physical profile or dimension XREF members.
          $edge59=Get-Content "$root/SupportOrthoNativeEdgeGeometry59.cs" -Raw
          $reader59=Get-Content "$root/SupportOrthoNativeEdgeSource59.cs" -Raw
          $planner59=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          $generator59=Get-Content "$root/SupportOrthoTenViewGenerator.cs" -Raw
          $refresh59=Get-Content "$root/SupportOrthoDimensionRefresh49.cs" -Raw
          foreach($token in @('NATIVE_EXPLICIT_STRAIGHT_EDGE',
              'public static Witness? Resolve(',
              'SupportOrthoNativeDimensionPolicy48.IsNativeKey')) {
            if(-not $edge59.Contains($token)) {
              throw "REV22.59 physical edge verification guard missing: $token"
            }
          }
          foreach($token in @('entity.Explode(pieces)',
              'MaxTemporaryObjectsPerMember',
              'transient.Dispose()')) {
            if(-not $reader59.Contains($token)) {
              throw "REV22.59 transient read-only native edge extractor missing: $token"
            }
          }
          foreach($token in @('ExactNativeEdgeProfileDimensions',
              'SupportOrthoNativeEdgeGeometry59.Resolve(',
              'EXACT_NATIVE_PROJECTED_PROFILE_EDGE_NOT_CUT_LENGTH')) {
            if(-not $planner59.Contains($token)) {
              throw "REV22.59 exact native profile planner not wired: $token"
            }
          }
          if(-not $generator59.Contains('REV22_59_EXACT_PROFILE_DIMS=') -or
             -not $refresh59.Contains('NativeEdgeSnapshot=')) {
            throw 'REV22.59 initial generation / fast refresh geometry evidence missing'
          }
          # REV22.58: reject physical DIMLINEAR extension/witness
          # crossings that REV22.57's baseline-only rectangles missed.
          # Intentional shared end datum stations remain legal.
          $geometry58=Get-Content "$root/SupportOrthoDimIntersections58.cs" -Raw
          $planner58=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          $generator58=Get-Content "$root/SupportOrthoTenViewGenerator.cs" -Raw
          foreach($token in @('WITNESS_CROSSES_DIMENSION_LINE_INTERIOR',
              'WITNESS_WITNESS_INTERSECTION',
              'TEXT_CROSSES_PRIOR_DIMENSION_WITNESS',
              'CrossesBaselineInterior(')) {
            if(-not $geometry58.Contains($token)) {
              throw "REV22.58 actual witness-geometry guard absent: $token"
            }
          }
          foreach($token in @('SupportOrthoDimIntersections58.Project(',
              'SupportOrthoDimIntersections58.Conflict(',
              'UnintendedAcceptedWitnessIntersections')) {
            if(-not $planner58.Contains($token)) {
              throw "REV22.58 intersection planner missing: $token"
            }
          }
          if(-not $generator58.Contains(
              'REV22_58_ACCEPTED_UNINTENDED_WITNESS_INTERSECTIONS=')) {
            throw 'REV22.58 real Plant 3D safety diagnostic missing'
          }
          # REV22.57: match manually arranged TOP/BOTTOM/LEFT/RIGHT
          # details. The overall MUST stay in the outermost actual
          # paper-space lane (regardless of member local bounding box).
          # Suppress only physically redundant sub-profile chains,
          # retain dynamic 50mm transverse section and native-only dims.
          $manual57=Get-Content "$root/SupportOrthoManualDetailStyle57.cs" -Raw
          $planner57=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          $gen57=Get-Content "$root/SupportOrthoTenViewGenerator.cs" -Raw
          foreach($token in @('InsideOverall(',
              'ObscuredByTerminalMember(',
              'PreferLocalMember(', 'ShowTerminalRemainder(')) {
            if(-not $manual57.Contains($token) -or
               -not $planner57.Contains($token)) {
              throw "REV22.57 source manual selection guard missing: $token"
            }
          }
          foreach($token in @('InnerThanReservedOverall(',
              'RedundantChainsSuppressed',
              'HierarchyCrossingsRejected')) {
            if(-not $planner57.Contains($token)) {
              throw "REV22.57 paper dimension hierarchy absent: $token"
            }
          }
          if(-not $gen57.Contains('REV22_57_REFERENCE_SELECTION=')) {
            throw 'REV22.57 missing per-view manual comparison diagnostics'
          }
          # REV22.56: the manually edited PDF uses member end faces
          # to split projected overall dimensions (e.g. measured
          # terminal section + remaining span), not 50 mm ghost
          # centerline segments. No sample model measurements are
          # hardcoded into production dimension creation.
          $datum56=Get-Content "$root/SupportOrthoReferenceDatum56.cs" -Raw
          $dim56=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          $gen56=Get-Content "$root/SupportOrthoTenViewGenerator.cs" -Raw
          foreach($token in @('TerminalMemberRemainderDimensions',
              'SupportOrthoReferenceDatum56.Choose(',
              'REFERENCE_TERMINAL_NATIVE_MEMBER_REMAINDER_NOT_CUT_LENGTH',
              'TERMINAL_REMAINDER_NO_CLEAR_LANE',
              'if(steps.Count>0)')) {
            if(-not $dim56.Contains($token)) {
              throw "REV22.56 manual end-member dimension policy absent: $token"
            }
          }
          foreach($token in @('public static Datum? Choose(',
              'full.Any(', 'SourceKey.StartsWith("NATIVE:"')) {
            if(-not $datum56.Contains($token)) {
              throw "REV22.56 native geometry qualification absent: $token"
            }
          }
          if(-not $gen56.Contains('REV22_56_REFERENCE_DATUM=')) {
            throw 'REV22.56 per-view native reference diagnostics missing'
          }
          # REV22.55: local structural-member cross-section DIMLINEAR
          # witnesses must originate at the *native member Start/End
          # axis midpoint*, not a bounding-box face. Change geometry
          # must move witness; never override dynamic dimension text.
          $mid55=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          foreach($token in @('nativeAxisMidpoints',
              'MidpointWitness', 'NativeMidpointMemberDimensions',
              'BoundsMidpointMemberDimensions',
              '"EXPLICIT_MEMBER_ENDPOINTS"')) {
            if(-not $mid55.Contains($token)) {
              throw "REV22.55 native axis-midpoint invariant missing: $token"
            }
          }
          $gen55=Get-Content "$root/SupportOrthoTenViewGenerator.cs" -Raw
          if(-not $gen55.Contains('REV22_55_NATIVE_MEMBER_MIDPOINT_DIMENSIONS=')) {
            throw 'REV22.55 native midpoint source diagnostics missing'
          }
          # REV22.54: the RIGHT overall lane must not be pushed into
          # LEFT view's printed pipe/steel labels by reserving two
          # imaginary outer lanes; log precise collision classes instead.
          $dim54=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          $layout54=Get-Content "$root/SupportOrthoReferenceLayout51.cs" -Raw
          $generator54=Get-Content "$root/SupportOrthoTenViewGenerator.cs" -Raw
          foreach($token in @('RejectionReason(',
              'OVERALL_DIAGNOSTICS=', '"ANNOTATION_TEXT_"+kind',
              'foreach(double offset in SupportOrthoReferenceLayout51')) {
            if(-not $dim54.Contains($token)) {
              throw "REV22.54 strict collision and near-left gutter guard missing: $token"
            }
          }
          if(-not $layout54.Contains('OverallLaneOffsets(') -or
             -not $generator54.Contains(
                 'REV22_54_RIGHT_OVERALL_COLLISION_DIAGNOSTICS=')) {
            throw 'REV22.54 paper gutter search and diagnostics integration missing'
          }
          # REV22.53: reserve native H and V overall dimensions before
          # any optional 50/100 mm member details, especially RIGHT/V
          # which REV22.52 skipped after local H placements.
          $priority53=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          foreach($token in @('reservedOverallAxes',
              'foreach(bool horizontal in new[]{false,true})',
              'PriorityOverallDimensions',
              'bool overallPlaced=reservedOverallAxes.Contains(horizontal)',
              'WitnessAt(request.Horizontal,request.From')) {
            if(-not $priority53.Contains($token)) {
              throw "REV22.53 overall-first collision priority missing: $token"
            }
          }
          $generator53=Get-Content "$root/SupportOrthoTenViewGenerator.cs" -Raw
          foreach($token in @('REV22_53_RIGHT_VERTICAL_OVERALL_PRESENT=',
              'REV22_53_OVERALL_DIMENSIONS_RESERVED_FIRST=')) {
            if(-not $generator53.Contains($token)) {
              throw "REV22.53 overall diagnostic missing: $token"
            }
          }
          # REV22.52: manual PDF requires missing measured native
          # profile widths and a RIGHT vertical overall, while invalid
          # connection/bolt station chains remain prohibited.
          $detail52=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          $gen52=Get-Content "$root/SupportOrthoTenViewGenerator.cs" -Raw
          foreach($token in @('LocalMemberDimensions',
              'REFERENCE_PROJECTED_MEMBER_ENVELOPE_NOT_CUT_LENGTH',
              'LOCAL_MEMBER_WIDTH_NO_CLEAR_LANE',
              'for(int textTier=0;textTier<10;textTier++)')) {
            if(-not $detail52.Contains($token)) {
              throw "REV22.52 reference PDF dimension improvement missing: $token"
            }
          }
          foreach($token in @('SPTC_ORTHO_VIEWPORT_NOPLOT',
              'EnsureNativeViewportsNoPlot52(',
              'IsPlottable=false',
              'REV22_52_PDF_VIEW=')) {
            if(-not $gen52.Contains($token)) {
              throw "REV22.52 native Ortho plot/dimension integration missing: $token"
            }
          }
          # REV22.51: mimic the user's explicitly re-positioned
          # six-view support PDF. H dimensions above, V left, inner
          # chain closer to the geometry than its outer overall line;
          # labels may not cover support outlines/callout gutters.
          $pdfLayout51=Get-Content "$root/SupportOrthoReferenceLayout51.cs" -Raw
          $refPlanner51=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          foreach($token in @('PreferredSide(','ShortTextBefore(',
              'OverallSeparation(', 'LaneOffsets(')) {
            if(-not $pdfLayout51.Contains($token) -or
               -not $refPlanner51.Contains($token)) {
              throw "REV22.51 reference PDF layout rule missing: $token"
            }
          }
          if(-not $refPlanner51.Contains('sourceMembers.Any(m=>p.Text.Intersects')) {
            throw 'REV22.51 dimension text must avoid structural silhouettes'
          }
          # REV22.50: local/50 mm chain distances must have two
          # independently verified source Start/End stations. AABB
          # contacts alone are not sufficient for a drafting dimension.
          # When only the Ortho viewport changes, re-project a bounded
          # native-only snapshot instead of reopening the source DWG.
          $detail50=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          foreach($token in @('LOCAL_CHAIN_UNVERIFIED_MEMBER_ENDPOINTS',
              'verifiedWitnessPoints.Any',
              'if(!VerifiedAt(start)||!VerifiedAt(end))',
              'if(preferExplicit&&exact.Length>0)')) {
            if(-not $detail50.Contains($token)) {
              throw "REV22.50 verified-native-datum guard missing: $token"
            }
          }
          $cache50=Get-Content "$root/SupportOrthoDimensionUpdatePlan49.cs" -Raw
          $refresh50=Get-Content "$root/SupportOrthoDimensionRefresh49.cs" -Raw
          foreach($token in @('NativeExtentSnapshot',
              'NativeEndpointSnapshot','CanReuseGeometrySnapshot(')) {
            if(-not $cache50.Contains($token) -or
               -not $refresh50.Contains($token)) {
              throw "REV22.50 reuse cache invariant missing: $token"
            }
          }
          if(-not $gen.Contains('REV22_50_NATIVE_GEOMETRY_CACHE_SAVED=') -or
             -not $gen.Contains('nativeDimensionSegments);')) {
            throw "REV22.50 generator native endpoint snapshot missing"
          }
          # REV22.49.4: dimension witnesses must use each real native
          # member face or an explicit matching Plant endpoint, not the
          # overall view envelope. Short 50-mm labels use alternating
          # exterior positions to avoid piling identical values.
          $refDim=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          $smartDim=Get-Content "$root/SupportOrthoSmartDimPlan46.cs" -Raw
          $writer=Get-Content "$root/SupportOrthoDimLinearWriter41.cs" -Raw
          foreach($token in @('WitnessAt(', 'verifiedWitnessPoints',
              'startWitness.Value','endWitness.Value',
              'bool putBefore=', 'textTier/2')) {
            if(-not $refDim.Contains($token)) {
              throw "REV22.49.4 source endpoint dimension invariant missing: $token"
            }
          }
          foreach($token in @('double face=horizontal?',
              'Thin(b.L,face', 'horizontal?face:b.B')) {
            if(-not $smartDim.Contains($token)) {
              throw "REV22.49.4 fallback native face invariant missing: $token"
            }
          }
          if(-not $writer.Contains('dim.Dimexo=0.0')) {
            throw 'REV22.49.4 reference DIMLINEAR must start exactly at member witness'
          }
          # REV22.49.3: skip full model DWG load if the original
          # source file stamp, native viewport poses and owned dimensions
          # match the persisted drawing snapshot.
          $refresh=Get-Content "$root/SupportOrthoDimensionRefresh49.cs" -Raw
          $updatePlan=Get-Content "$root/SupportOrthoDimensionUpdatePlan49.cs" -Raw
          foreach($token in @('ReadFastPaperState(','CanSkipModelReload(',
              'DIM_FAST_PATH=SKIPPED_SOURCE_RELOAD',
              'SourceWriteUtcTicks=sourceWriteTicks',
              'ViewPoseSignature(','Stopwatch.StartNew()')) {
            if(-not $refresh.Contains($token)) {
              throw "REV22.49.3 fast update path missing: $token"
            }
          }
          foreach($token in @('SourceWriteUtcTicks=0',
              'SourceFileLength=-1','LastViewPoseSignature',
              'LastOwnedDimensionCount=-1','CanSkipModelReload(',
              'ViewPoseSignature(')) {
            if(-not $updatePlan.Contains($token)) {
              throw "REV22.49.3 persisted change-detection policy missing: $token"
            }
          }
          # REV22.49.2: use actual native saved-viewport scale to
          # let AutoCAD generate dimension text; no numeric overrides.
          $dyn=Get-Content "$root/SupportOrthoDynamicDimension492.cs" -Raw
          $dimPlan=Get-Content "$root/SupportOrthoDimLinearPlan41.cs" -Raw
          $dimWriter=Get-Content "$root/SupportOrthoDimLinearWriter41.cs" -Raw
          foreach($token in @('ModelMillimetersPerPaperUnit',
              'MeasuredMillimeters','MatchesDiagnostic')) {
            if(-not $dyn.Contains($token)) {
              throw "REV22.49.2 dynamic dimension math missing: $token"
            }
          }
          foreach($token in @('dim.Dimlfac=item.PaperToModelMm!.Value',
              'dim.DimensionText=string.Empty',
              'dimensionLine,dynamicMeasurement?string.Empty:',
              'SupportOrthoDynamicDimension492.MatchesDiagnostic')) {
            if(-not $dimWriter.Contains($token)) {
              throw "REV22.49.2 hard-coded dimension guard missing: $token"
            }
          }
          if(-not $dimPlan.Contains('double? PaperToModelMm=null')) {
            throw 'REV22.49.2 dimension record must carry native factor'
          }
          foreach($filename in @('SupportOrthoReferenceDimPlan47.cs',
              'SupportOrthoSmartDimPlan46.cs',
              'SupportOrthoAllViewDimPlan44.cs')) {
            $planner=Get-Content "$root/$filename" -Raw
            if(-not $planner.Contains('ModelMillimetersPerPaperUnit')) {
              throw "REV22.49.2 numeric text still hard-coded in $filename"
            }
          }
          # REV22.49: source and saved viewport identity persisted in
          # paper DWG. CommandEnded/Idle triggers atomic owner-only
          # dimension replacement; no new public commands.
          $update=Get-Content "$root/SupportOrthoDimensionRefresh49.cs" -Raw
          $policy=Get-Content "$root/SupportOrthoDimensionUpdatePlan49.cs" -Raw
          foreach($token in @('PLANTORTHOUPDATE',
              'DocumentCreated','CommandEnded','AcadApp.Idle',
              'SaveInitial(', 'NamedObjectsDictionaryId',
              'ReadDwgFile(', 'replaceGenerated:true',
              'XREF', 'SupportOrthoNativeDimensionPolicy48')) {
            if(-not $update.Contains($token)) {
              throw "REV22.49 automatic update architecture missing: $token"
            }
          }
          foreach($token in @('NeedsReplace','ManifestKey',
              'Resolve(','Signature(','IsNativeKey')) {
            if(-not ($policy+$update).Contains($token)) {
              throw "REV22.49 safety invariant missing: $token"
            }
          }
          $writer=Get-Content "$root/SupportOrthoDimLinearWriter41.cs" -Raw
          foreach($token in @('GetXDataForApplication(',
              'DxfCode.ExtendedDataRegAppName',
              'previous.Erase();','replaceGenerated')) {
            if(-not $writer.Contains($token)) {
              throw "REV22.49 owner-only atomic rewrite missing: $token"
            }
          }
          if(-not $gen.Contains('REV22_49_AUTO_UPDATE_MANIFEST=PASS') -or
             -not $gen.Contains('REV22_49_XREF_DIMENSIONS_DISABLED=TRUE')) {
            throw 'REV22.49 generated drawing registration missing'
          }
          # REV22.48: host-native-only dimensions. XREFs may have
          # annotations but never a DIMLINEAR source or datum station.
          $nativePolicy=Get-Content "$root/SupportOrthoNativeDimensionPolicy48.cs" -Raw
          $nativeSource=Get-Content "$root/SupportOrthoDimensionSource41.cs" -Raw
          foreach($token in @('StartsWith("NATIVE:"',
              'XREF', 'AcceptMember(', 'AcceptSegment(')) {
            if(-not $nativePolicy.Contains($token)) {
              throw "REV22.48 native dimension boundary missing: $token"
            }
          }
          if($nativeSource.Contains('TryRead(member.Id,member.ToHost') -or
             -not $nativeSource.Contains('DIM48_XREF_SOURCE_SEGMENTS_EXCLUDED=')) {
            throw 'REV22.48 XREF endpoint extraction must be disabled'
          }
          foreach($token in @('REV22_48_XREF_DIMENSION_POLICY=DISABLED',
              'REV22_48_NATIVE_MEMBER_DIMENSION_SOURCES=',
              'REV22_48_XREF_DIMENSIONS_CREATED=0')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.48 native-only integration missing: $token"
            }
          }
          # REV22.47 preserves the user-supplied p15/p16 shop-drawing
          # dimension-chain and overall conventions as a selectable mode.
          $detail=Get-Content "$root/SupportOrthoReferenceDimPlan47.cs" -Raw
          foreach($token in @('SelectStations','CHAIN_NOT_FITTED_TO_ONE_LANE',
              'REFERENCE_PROJECTED_OVERALL_NOT_CUT_LENGTH',
              'REFERENCE_PROJECTED_DATUM_CHAIN_NOT_BOLT_PITCH')) {
            if(-not $detail.Contains($token)) {
              throw "REV22.47 reference-detail planner missing: $token"
            }
          }
          if(-not $ui.Contains('Reference detail: chain + overall (PDF style)') -or
             -not $ui.Contains('referenceDimensions.Checked = true')) {
            throw 'REV22.47 reference-detail UI default missing'
          }
          foreach($token in @('SupportOrthoReferenceDimPlan47.Build(',
              'REV22_47_CHAIN_DIMENSIONS=',
              'REV22_47_OVERALL_DIMENSIONS=')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.47 native generator integration missing: $token"
            }
          }
          # REV22.46 collision-aware planner has fixed annotation obstacles,
          # native view/title keepouts and no forced overlapping placements.
          $smart = Get-Content 'src/SPTC.SupportDrawings/SupportOrthoSmartDimPlan46.cs' -Raw
          foreach($token in @('BuildFixedZones','CollisionCandidatesRejected',
              'NO_COLLISION_FREE_DIMENSION_LANE','repositioned++',
              'ProjectBounds')) {
            if ($smart -notmatch [regex]::Escape($token)) {
              throw "REV22.46 smart-layout invariant missing: $token"
            }
          }
          foreach($token in @('REV22_46_AUTO_REPOSITIONED=',
              'REV22_46_COLLIDING_CANDIDATES_REJECTED=',
              'REV22_46_DIMENSION_COVERAGE=')) {
            if ($gen -notmatch [regex]::Escape($token)) {
              throw "REV22.46 integration log missing: $token"
            }
          }
          # REV22.44: all recognized structure/support members receive
          # independent horizontal/vertical projected OVERALL dimensions on
          # each of six orthographic views (no cross-view size dedup).
          # REV22.41 legacy true-length planner stays under regression tests.
          $allBounds=Get-Content "$root/SupportOrthoAllMemberExtent44.cs" -Raw
          $allPlan=Get-Content "$root/SupportOrthoAllViewDimPlan44.cs" -Raw
          foreach($token in @('verifiedSteel','verifiedSupport',
              'SupportOrthoXrefMemberDiscovery37.Item',
              'GetObject(id,OpenMode.ForRead',
              'xref.WorldBounds','DIM44_RECOGNIZED_MEMBERS')) {
            if(-not $allBounds.Contains($token)) {
              throw "REV22.44 known member source guard missing: $token"
            }
          }
          foreach($token in @('TOP','BOTTOM','FRONT','BACK','LEFT','RIGHT',
              'foreach(Member m in members.OrderBy',
              'foreach(bool horizontal in new[]{true,false})',
              'WorldCorners(m)','ISO_DIMLINEAR_NOT_VALID',
              'PROJECTED_OVERALL_VIEW_ENVELOPE','NO_SAFE_DIMLINE_LANE',
              'members.Count*axial*2')) {
            if(-not $allPlan.Contains($token)) {
              throw "REV22.44 per-view H/V projection guard missing: $token"
            }
          }
          foreach($token in @('SupportOrthoAllMemberExtent44.Read(',
              'SupportOrthoSmartDimPlan46.Build(',
              'REV22_44_DIMENSION_MODE=PER_MEMBER_PER_ORTHOGRAPHIC_VIEW_H_AND_V',
              'REV22_44_HV_AXES_REQUESTED=',
              'REV22_44_VIEW=',
              'REV22_44_DIMENSIONS_CREATED=')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.44 model-Ortho integration missing: $token"
            }
          }
          if(-not $ui.Contains('Auto H/V dimensions: native members only')) {
            throw 'REV22.44 auto H/V all-members UI control missing'
          }
          foreach($token in @('options.AutoDimLinear',
              'SupportOrthoDimensionSource41.Read(',
              'SupportOrthoSmartDimPlan46.Build(',
              'SupportOrthoDimLinearWriter41.Write(',
              'REV22_41_DIMENSIONS_CREATED=',
              'REV22_49_DIMENSIONS_REGENERATE_ON_PLANTORTHOUPDATE=TRUE')) {
            if(-not $gen.Contains($token)) {
              throw "REV22.41 ten-view integration missing: $token"
            }
          }
          if(-not $ui.Contains('Auto H/V dimensions: native members only') -or
             -not $ui.Contains('autoDimLinear.Checked = true') -or
             -not $ui.Contains('autoDimLinear.Checked,referenceDimensions.Checked);')) {
            throw 'REV22.41 persistent UI option must be default ON and retained'
          }
          foreach($token in @('SupportOrthoPipeDiscovery28.ReadXrefs',
              'SupportOrthoMemberCalloutPlan27.Build',
              'CreateNativePaperMemberLeaders27',
              'STEP10_MEMBER_ANNOTATIONS_CHECK',
              'STEP5_PAPER_POINT_CLICKS_REQUIRED=0')) {
            if(-not $gen.Contains($token)) {throw "Critical generation invariant missing: $token"}
          }
          foreach($legacy in @('SupportOrthoUpdateAudit29.cs',
              'SupportOrthoXrefUpdateAudit30.cs',
              'SupportOrthoXrefAuditManifest30.cs')) {
            if(Test-Path "$root/$legacy") {throw "Completed audit still ships: $legacy"}
          }
          $sourceText=(Get-ChildItem $root -Filter '*.cs' |
            ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          foreach($cmd in @('SPTC_ORTHO22_29_AUDIT_UPDATE',
              'SPTC_ORTHO22_30_VALIDATE_XREF_UPDATE')) {
            if($sourceText.Contains($cmd)) {
              throw "Obsolete audit command still registered: $cmd"
            }
          }
          # All command registrations in the shipped source must equal exactly these four.
          $required=@('SPTC_SUPPORTORTHO10','SPTC_SUPPORTEXPORT',
              'SPTC_SUPPORTBATCH','SPTC_SUPPORT2DBATCH') | Sort-Object
          $actual=@()
          foreach($hit in [regex]::Matches($sourceText,
              '\[\s*CommandMethod\s*\(\s*"([^"]+)"')) {
            $actual+= $hit.Groups[1].Value
          }
          $actual=@($actual | Sort-Object)
          if($actual.Count -ne 4 -or
             @(Compare-Object -ReferenceObject $required -DifferenceObject $actual).Count -gt 0) {
            throw "REV22.33 requires exactly four commands. Found: $($actual -join ', ')"
          }
          foreach($diagnostic in @('NativeOrthoTopPreflight.cs',
              'NativeOrthoIsoReferenceComparison.cs')) {
            if(Test-Path "$root/$diagnostic") {throw "Legacy command file still shipped: $diagnostic"}
          }
          # REV22.38 visible annotation: no LINE NO/XREF STRUCTURE/SUPPORT
          # prefixes, no .dwg suffix; preserve BOP and source provenance.
          if(-not $labels.Contains('return tag+"\n"+bop;') -or
             $labels.Contains('return "LINE NO: "+tag')) {
            throw 'REV22.38 bare pipe tag and unchanged BOP formatting missing'
          }
          $members=Get-Content "$root/SupportOrthoMemberCalloutPlan27.cs" -Raw
          if(-not $members.Contains('Path.GetFileNameWithoutExtension(member.XrefDrawingName!)') -or
             $members.Contains('"XREF "+(member.XrefKind')) {
            throw 'REV22.38 XREF source basename label missing'
          }
          if(-not $gen.Contains('REV22_38_PIPE_LABEL_FORMAT=BARE_LINE_TAG_AND_BOP')) {
            throw 'REV22.38 pipe label log marker missing'
          }
          if(Get-ChildItem $root -Filter '*Test.cs') {
            throw 'Historical development command clones must not ship in the active source tree'
          }
          if(Select-String -Path "$root/*.cs" -Pattern '\[CommandMethod\(".*_TEST"') {
            throw 'Experimental test commands must not be in the production assembly'
          }
      - name: Test support geometry and native-viewport projection helpers
        run: dotnet run --project tests/SupportSheetSmokeTests/SupportSheetSmokeTests.csproj -c Release
      - name: Test compact XREF pipe labels
        run: dotnet run --project tests/Rev229LabelSmokeTests/Rev229LabelSmokeTests.csproj -c Release
      - name: Test REV22.35 native view subset and title-callout guards
        run: dotnet run --project tests/Rev235UiSmokeTests/Rev235UiSmokeTests.csproj -c Release
      - name: Test embedded logo and Windows Forms icon
        run: dotnet run --project tests/Rev236BrandingSmokeTests/Rev236BrandingSmokeTests.csproj -c Release
      - name: Test REV22.39 automatic, preset and custom 1:N scales
        run: dotnet run --project tests/Rev239ScaleSmokeTests/Rev239ScaleSmokeTests.csproj -c Release
      - name: Test REV22.40 persistent WinForms UI and queued-run busy control
        run: dotnet run --project tests/Rev240PaletteSmokeTests/Rev240PaletteSmokeTests.csproj -c Release
      - name: Test REV22.41 safe horizontal/vertical native and XREF DIMLINEAR plan
        run: dotnet run --project tests/Rev241DimLinearSmokeTests/Rev241DimLinearSmokeTests.csproj -c Release
      - name: Compile production DLL
        run: dotnet build src/SPTC.SupportDrawings/SPTC.SupportDrawings.csproj -c Release
      - name: Verify compiled DLL
        shell: pwsh
        run: |
          $dll='src/SPTC.SupportDrawings/bin/Release/net8.0-windows/SPTC.SupportDrawings.dll'
          if(-not (Test-Path $dll)) {throw 'DLL not generated'}
          $size=(Get-Item $dll).Length
          if($size -lt 100000) {throw "DLL unexpectedly small: $size"}
          Write-Host "REV22.59 verified native straight geometry edge DLL bytes: $size"
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SPTC-SupportDrawings-Plant3D2025-REV22_59-NATIVE-GEOMETRY-EDGES
          path: src/SPTC.SupportDrawings/bin/Release/net8.0-windows/SPTC.SupportDrawings.dll
          retention-days: 30
          if-no-files-found: error
